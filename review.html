<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MASTER — design preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101a14;color:#eef4ef;font:14px Arial,sans-serif}header{padding:16px 22px;border-bottom:1px solid #35493b;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header strong{font-size:14px}nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;font-size:12px;background:#14251b;color:#eef4ef;border:1px solid #607268;border-radius:4px;min-height:40px;padding:10px 13px;cursor:pointer}button[aria-pressed=true]{background:#3ddc5a;color:#04110a;border-color:#3ddc5a}button:focus-visible{outline:3px solid #6cf08a;outline-offset:3px}#stage{position:relative;max-width:1440px;margin:22px auto 0;width:calc(100% - 44px);overflow:hidden}iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0;background:#050a07}#status{font-size:12px;color:#b9c7be;min-height:18px}footer{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:16px 22px 22px}a{color:#b9c7be;font-size:12px}@media(max-width:600px){header{padding:12px;gap:10px}#stage{width:calc(100% - 24px);margin-top:12px}nav{width:100%}button{min-height:44px;font-size:11px;padding:9px 10px}}</style></head><body>
<header><strong>AI AGENT 1.0 MASTER · design preview</strong><nav aria-label="Preview"><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button><button id="play">Replay animation</button><button id="large">View tablet</button></nav><span id="status" aria-live="polite"></span></header>
<main id="stage"><iframe id="preview" title="AI AGENT 1.0 MASTER page layout" src="index.html?export=1&amp;animate=1" width="1440" height="1800"></iframe></main>
<footer><a href="index.html">Open at actual size</a><a href="../README.md">Documentation</a></footer>
<script>(()=>{'use strict';const frame=document.getElementById('preview'),stage=document.getElementById('stage');let width=1440;function viewport(){if(!frame.contentDocument)return;const h=width===390?844:900;frame.contentDocument.documentElement.style.setProperty('--stage-height',h+'px');frame.contentDocument.documentElement.style.setProperty('--scene-final-height',(h*.65)+'px');}function fit(){if(!frame.contentDocument||!frame.contentDocument.body)return;const contentHeight=Math.ceil(frame.contentDocument.body.getBoundingClientRect().height);const scale=Math.min(1,stage.clientWidth/width);frame.style.width=width+'px';frame.style.height=contentHeight+'px';frame.style.transform='scale('+scale+')';stage.style.height=contentHeight*scale+'px';stage.style.maxWidth=width+'px';}function mode(w){width=w;viewport();frame.style.width=width+'px';document.getElementById('desktop').setAttribute('aria-pressed',String(w===1440));document.getElementById('mobile').setAttribute('aria-pressed',String(w===390));requestAnimationFrame(fit);if(w===390)frame.contentWindow.masterPreview?.still();}frame.addEventListener('load',()=>{viewport();frame.contentDocument.documentElement.style.overflow='hidden';frame.contentDocument.fonts.ready.then(fit);new ResizeObserver(fit).observe(frame.contentDocument.body);fit();});new ResizeObserver(fit).observe(stage);document.getElementById('desktop').onclick=()=>mode(1440);document.getElementById('mobile').onclick=()=>mode(390);document.getElementById('play').onclick=()=>frame.contentWindow.masterPreview?.play();document.getElementById('large').onclick=()=>frame.contentDocument.getElementById('detail').showModal();setInterval(()=>{const text=frame.contentDocument?.getElementById('phase-status')?.textContent;const status=document.getElementById('status');if(text&&status.textContent!==text)status.textContent=text;},400);})();</script>
</body></html>
