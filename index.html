<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI AGENT 1.0 MASTER — design package</title>
<style>
@font-face{font-family:Montserrat;src:url('fonts-and-licenses/Montserrat-Variable.ttf');font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#111713;color:#eef4ef;font:15px/1.6 Montserrat,Arial,sans-serif}header{padding:26px 32px 20px;border-bottom:1px solid #36463b;background:#08100b}h1{font-size:24px;line-height:1.3;margin:0 0 8px}p{margin:0;color:#b9c7be}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}button,a{font:inherit;color:inherit}button{background:#15251b;border:1px solid #526559;border-radius:5px;padding:11px 16px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#3ddc5a;border-color:#3ddc5a;color:#04110a;font-weight:650}a{color:#9af3af;text-underline-offset:4px}a:focus-visible,button:focus-visible{outline:3px solid #6cf08a;outline-offset:4px}.links{display:flex;gap:22px;flex-wrap:wrap;margin-top:15px}main{padding:28px 24px 44px;text-align:center}figure{margin:0 auto;width:max-content;max-width:100%}img{display:block;max-width:100%;height:auto;box-shadow:0 12px 40px #0007}figcaption{text-align:left;margin-top:12px;color:#b9c7be;font-size:13px}.note{padding:0 24px 32px;max-width:1040px;margin:auto;font-size:13px}@media(max-width:600px){header{padding:22px 20px}h1{font-size:19px}main{padding:20px 12px 28px}.tools{gap:8px}button{font-size:12px;padding:10px}.links{font-size:12px;gap:12px}}
</style>
</head>
<body>
<header>
  <h1>AI AGENT 1.0 MASTER</h1>
  <p>Desktop and mobile layouts · editable sources</p>
  <nav class="tools" aria-label="Design views">
    <button data-view="desktop" aria-pressed="true">Desktop</button>
    <button data-view="mobile" aria-pressed="false">Mobile</button>
    <button data-view="desktop-intro" aria-pressed="false">Intro</button>
    <button data-view="mobile-intro" aria-pressed="false">Mobile intro</button>
    <button data-view="components-and-states" aria-pressed="false">States</button>
    <button data-view="tablet-storyboard" aria-pressed="false">Motion sequence</button>
    <button data-view="desktop-1024" aria-pressed="false">1024 px</button>
    <button data-view="tablet-768" aria-pressed="false">768 px</button>
    <button data-view="transitions-map" aria-pressed="false">Link map</button>
  </nav>
  <div class="links">
    <a href="prototype/index.html">View animation</a>
    <a id="svg-link" href="sources/desktop.svg" download>Download editable SVG</a>
    <a id="png-link" href="previews/desktop.png" download>Download PNG</a>
    <a href="README.md">Read the documentation</a>
  </div>
</header>
<main><figure><img id="preview" src="previews/desktop.png?v=3" width="1440" height="1765" alt="Complete desktop page"><figcaption id="caption">Desktop · 1440 × 1765 px · complete page after Done</figcaption></figure></main>
<p class="note">Editable SVG text and vector elements, with separate city and foreground assets.</p>
<script>
const views={desktop:['Complete desktop page',1440,1765,'Desktop · 1440 × 1765 px · complete page after Done'],mobile:['Complete mobile page',390,2074,'Mobile · 390 × 2074 px · complete page after Done'],'desktop-1024':['Control export at 1024 px',1024,1622,'Control export · 1024 × 1622 px'],'tablet-768':['Control export at 768 px',768,1834,'Control export · 768 × 1834 px'],'transitions-map':['Link map',1440,1038,'Where each button and link leads'],'desktop-intro':['Full-screen intro',1440,900,'Intro · 1440 × 900 px'],'mobile-intro':['Mobile intro',390,846,'Mobile intro · 390 × 846 px'],'components-and-states':['Button and link states',1440,1040,'Default · hover · keyboard focus'],'tablet-storyboard':['Tablet motion sequence',1440,620,'Request → Master → agents → Master → Done']};
for(const button of document.querySelectorAll('[data-view]'))button.addEventListener('click',()=>{const id=button.dataset.view,v=views[id],img=document.getElementById('preview');img.src='previews/'+id+'.png?v=3';img.alt=v[0];img.width=v[1];img.height=v[2];document.getElementById('caption').textContent=v[3];document.getElementById('svg-link').href=(id==='desktop-1024'||id==='tablet-768')?'prototype/index.html':'sources/'+id+'.svg';document.getElementById('png-link').href='previews/'+id+'.png';for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));});
</script>
</body></html>
